<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Placeholder avatar with initials AP">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#0d2137"/>
      <stop offset="100%" stop-color="#061018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <g stroke="#22d3ee" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 80 H400 M0 160 H400 M0 240 H400 M0 320 H400"/>
    <path d="M80 0 V400 M160 0 V400 M240 0 V400 M320 0 V400"/>
  </g>
  <!-- Geometric hexagon frame -->
  <polygon points="200,36 340,118 340,282 200,364 60,282 60,118"
           fill="none" stroke="url(#ring)" stroke-width="2.5"/>
  <polygon points="200,68 312,134 312,266 200,332 88,266 88,134"
           fill="#0a1628" fill-opacity="0.55" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>
  <!-- Corner accents -->
  <circle cx="200" cy="36" r="4" fill="#22d3ee"/>
  <circle cx="340" cy="118" r="3" fill="#3b82f6"/>
  <circle cx="340" cy="282" r="3" fill="#22d3ee"/>
  <circle cx="200" cy="364" r="4" fill="#6366f1"/>
  <circle cx="60" cy="282" r="3" fill="#22d3ee"/>
  <circle cx="60" cy="118" r="3" fill="#3b82f6"/>
  <!-- Initials -->
  <text x="200" y="225" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="118" font-weight="700" fill="url(#accent)" letter-spacing="-4">AP</text>
  <!-- Placeholder label -->
  <rect x="110" y="288" width="180" height="28" rx="14" fill="#061018" fill-opacity="0.85" stroke="#22d3ee" stroke-opacity="0.4"/>
  <text x="200" y="307" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="12" font-weight="600" fill="#67e8f9" letter-spacing="2">PLACEHOLDER</text>
</svg>
